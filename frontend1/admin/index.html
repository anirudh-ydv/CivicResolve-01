<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicResolve Admin</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Loading screen shown only briefly, before the stored-token check resolves -->
    <div id="boot-loading" style="display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg);">
      <div class="loading-spinner" style="margin:0 auto 16px;"></div>
    </div>

    <!-- Login view -->
    <div id="login-view" class="login-container" role="main" style="display:none;">
      <div class="login-card glass-panel">
        <div class="login-header">
          <div class="login-logo" aria-hidden="true">CR</div>
          <h1>CivicResolve Admin</h1>
          <p>Sign in to access the dashboard</p>
        </div>

        <div id="login-error" class="login-error" role="alert" aria-live="assertive" style="display:none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <line x1="15" y1="9" x2="9" y2="15" />
            <line x1="9" y1="9" x2="15" y2="15" />
          </svg>
          <span id="login-error-text"></span>
        </div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" class="form-input" placeholder="Enter username" autocomplete="username" required />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Enter password" autocomplete="current-password" required />
          </div>

          <button type="submit" id="login-submit-btn" class="btn btn-primary login-submit" disabled>
            Sign In
          </button>
        </form>

        <div class="login-hint">
          <p>Default credentials (dev):</p>
          <code>admin</code> / <code>changeme123</code>
        </div>
      </div>
    </div>

    <!-- Dashboard-loading view -->
    <div id="dashboard-loading" style="display:none;align-items:center;justify-content:center;height:100vh;background:var(--bg);">
      <div style="text-align:center;">
        <div class="loading-spinner" style="margin:0 auto 16px;"></div>
        <p style="color:var(--text-muted);">Loading dashboard...</p>
      </div>
    </div>

    <!-- Main dashboard view -->
    <div id="app-view" class="app-layout" style="display:none;">
      <header class="header">
        <div class="header-left">
          <div class="logo">CR</div>
          <h1>CivicResolve Admin</h1>
        </div>
        <div class="header-right">
          <div id="stats-cards"></div>
          <button id="logout-btn" class="btn btn-secondary" style="padding:8px 16px;font-size:13px;height:36px;margin-right:8px;">
            Sign Out
          </button>
          <button id="refresh-btn" class="btn btn-primary" style="padding:8px 16px;font-size:13px;height:36px;">
            Refresh
          </button>
        </div>
      </header>

      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title">Filters</div>
          <div class="filters">
            <select id="category-filter" class="filter-btn" style="padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;min-width:160px;">
              <option value="all">All Categories</option>
              <option value="pothole">Pothole</option>
              <option value="broken_streetlight">Broken Streetlight</option>
              <option value="graffiti">Graffiti</option>
              <option value="illegal_dumping">Illegal Dumping</option>
              <option value="cracked_sidewalk">Cracked Sidewalk</option>
              <option value="damaged_sign">Damaged Sign</option>
              <option value="other">Other</option>
            </select>

            <select id="status-filter" class="filter-btn" style="padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;min-width:140px;">
              <option value="all">All Statuses</option>
              <option value="pending_review">Pending Review</option>
              <option value="open">Open</option>
              <option value="in_progress">In Progress</option>
              <option value="resolved">Resolved</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
        </div>

        <div id="reports-table-container"></div>
      </aside>

      <main class="map-container">
        <div id="map" class="map-wrapper" style="height:100%;width:100%;"></div>
        <div id="map-error-banner" style="display:none;position:absolute;top:20px;left:20px;right:20px;background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:12px 16px;border-radius:8px;font-size:13px;z-index:100;"></div>
      </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
