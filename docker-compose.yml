version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_USER=civicresolve
      - POSTGRES_PASSWORD=civicresolve_dev_pw
      - POSTGRES_DB=civicresolve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicresolve -d civicresolve"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./backend/models:/app/models
    environment:
      - DATABASE_URL=postgresql+psycopg2://civicresolve:civicresolve_dev_pw@db:5432/civicresolve
      - SQL_ECHO=false
      - MODEL_PATH=/app/models/civicresolve_model.pth
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=changeme123
      - CIVICRESOLVE_SECRET_KEY=dev-secret-change-in-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    depends_on:
      db:
        condition: service_healthy
    # Runs the migration (create tables + seed real geo data) before
    # starting the server. Both scripts are idempotent - safe to re-run
    # on every container start (seed_geo_data.py no-ops if rows already
    # exist, see models/seed_geo_data.py).
    command: >
      sh -c "python -c 'from models.database import init_db; init_db()' &&
             python models/seed_geo_data.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FIXED: these two services used to build+run the old React/Vite dev
  # server (npm install / npm run dev), which no longer applies now that
  # the frontend is plain HTML/CSS/vanilla JS with no build step. nginx
  # just serves the static files directly - no Dockerfile, no npm, no
  # node_modules volume needed. VITE_API_URL is also gone: the plain JS
  # version reads its API URL from a hardcoded API_BASE_URL constant in
  # each app's own config.js instead of a build-time env var.
  frontend1:
    image: nginx:alpine
    ports:
      - "5173:80"
    volumes:
      - ./frontend1/app:/usr/share/nginx/html:ro

# FIXED: postgres_data was referenced by the db service above but was
# never declared here - docker-compose would refuse to start with a
# config validation error ("undefined volume"). model_cache and uploads
# were declared here but never actually used by any service (the real
# mounts above are bind paths like ./backend/models, not named volumes),
# so they've been removed rather than left as dead, confusing config.
volumes:
  postgres_data: